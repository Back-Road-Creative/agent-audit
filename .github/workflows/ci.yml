name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Must start at the `requires-python` floor in pyproject.toml: a floor
        # no leg of this matrix exercises is a promise nothing checks.
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'

      - name: Test
        # The suite must pass without the `claude` CLI installed — it is not on
        # this runner, so a test that shells out to it fails here rather than in
        # someone's checkout.
        run: pytest

      - name: Console script is wired up
        run: agent-audit --version

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ruff
        run: pip install ruff==0.14.0

      - run: ruff check .
      - run: ruff format --check .
