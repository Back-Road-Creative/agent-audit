[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-audit"
version = "0.1.0"
description = "Code-orchestrated auditors for AI-agent configuration: skills, instruction files, and workflow maturity"
readme = "README.md"
license = { text = "MIT" }
# 3.11 is the floor because it is the oldest interpreter still under full
# upstream support, and the oldest the CI matrix actually exercises. Nothing in
# the code needs a 3.11-only feature — but a `requires-python` looser than the
# matrix is an untested promise, so the two are kept in step.
requires-python = ">=3.11"
authors = [{ name = "Joe Petrucelli", email = "joepetjr@gmail.com" }]
keywords = ["ai", "agents", "audit", "llm", "prompt-engineering", "static-analysis"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
]
# Standard library only. The analysis passes shell out to the `claude` CLI,
# which is a runtime prerequisite rather than a Python dependency.
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
agent-audit = "agent_audit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"agent_audit.prompts" = ["*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
